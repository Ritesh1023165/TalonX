name: Scorecard panel build

# TICKER_SCORECARD_V1, Phase 1. Manual trigger only. Builds the daily panel and runs data gates 1 and 2.
# Reads market data only. Computes no returns. Never touches the live engine.
# Needs repository secrets: APCA_API_KEY_ID, APCA_API_SECRET_KEY, SEC_USER_AGENT
# (SEC_USER_AGENT is the contact string SEC asks for, e.g. "Your Name your@email"; the same value as TALONX_SEC_USER_AGENT).

on:
  workflow_dispatch:
    inputs:
      max_symbols:
        description: "Symbols to fetch. 60 = smoke test, 0 = all"
        required: true
        default: "60"
      study_step:
        description: "Study step to run after the data stages: none / freeze / fit / validate / holdout. Each runs ONCE."
        required: false
        default: "none"
      confirm:
        description: "validate needs I_APPROVE_VALIDATE, holdout needs I_APPROVE_HOLDOUT (single-use reads)"
        required: false
        default: ""
      run_sec:
        description: "Also run the SEC stage (gates 3-4, features F5-F10). Needs max_symbols=0 to be meaningful. true / false"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas numpy requests pytest scikit-learn scipy
      - name: Unit tests
        run: python -m pytest tests/test_scorecard_foundation.py tests/test_scorecard_sec.py tests/test_scorecard_model.py -q
      - name: Symbol list from SEC
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python - <<'PY'
          import os, requests, pandas as pd
          ua = os.environ["SEC_USER_AGENT"]
          d = requests.get("https://www.sec.gov/files/company_tickers.json", headers={"User-Agent": ua}, timeout=60)
          d.raise_for_status()
          syms = sorted({v["ticker"].upper() for v in d.json().values() if v.get("ticker")})
          pd.DataFrame({"symbol": syms}).to_csv("universe.csv", index=False)
          print(len(syms), "tickers from SEC")
          PY
      - name: Restore fetched batches (skips the download when cached)
        uses: actions/cache@v4
        with:
          path: results/scorecard_v1/panel/_batches
          key: scorecard-batches-v1-${{ github.run_id }}
          restore-keys: scorecard-batches-v1-
      - name: Build panel and run gates 1-2
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python scripts/scorecard_build_panel.py --symbols-file universe.csv --max-symbols ${{ github.event.inputs.max_symbols }}
      - name: Show report
        if: always()
        run: cat results/scorecard_v1/panel/gate_report.json || true
      - name: SEC stage (bulk files only; gates 3-4, features F5-F10)
        if: ${{ github.event.inputs.run_sec == 'true' }}
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/scorecard_sec_stage.py
      - name: Study step (single use; result is committed to this branch)
        if: ${{ github.event.inputs.study_step != 'none' && github.event.inputs.study_step != '' }}
        env:
          STEP: ${{ github.event.inputs.study_step }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$STEP" = "validate" ] && [ "$CONFIRM" != "I_APPROVE_VALIDATE" ]; then echo "validate needs confirm=I_APPROVE_VALIDATE"; exit 7; fi
          if [ "$STEP" = "holdout" ] && [ "$CONFIRM" != "I_APPROVE_HOLDOUT" ]; then echo "holdout needs confirm=I_APPROVE_HOLDOUT"; exit 7; fi
          python scripts/scorecard_study.py --step "$STEP"
          git config user.name "scorecard-bot"
          git config user.email "scorecard-bot@users.noreply.github.com"
          git add -f "results/scorecard_v1/$STEP"
          git commit -m "scorecard study: $STEP result (code $(git rev-parse --short HEAD))"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Show SEC report
        if: ${{ always() && github.event.inputs.run_sec == 'true' }}
        run: cat results/scorecard_v1/sec/sec_stage_report.json || true
      - name: Keep SEC report and raw features
        if: ${{ always() && github.event.inputs.run_sec == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-sec
          path: |
            results/scorecard_v1/sec/sec_stage_report.json
            results/scorecard_v1/sec/raw_features.pkl.gz
          retention-days: 30
          compression-level: 0
      - name: Keep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-gate-report
          path: |
            results/scorecard_v1/panel/gate_report.json
            results/scorecard_v1/panel/split_check_details.csv
      - name: Keep panel (for the next research stages)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-panel
          path: results/scorecard_v1/panel/panel_frames.pkl.gz
          retention-days: 30
          compression-level: 0
